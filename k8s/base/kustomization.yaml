apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - app/configmap.yaml
  - app/deployment.yaml
  - app/service.yaml
  - app/hpa.yaml
  - app/pdb.yaml
  - app/reconcile-cronjob.yaml
  - mongodb/statefulset.yaml
  - mongodb/service.yaml
  - elasticsearch/statefulset.yaml
  - elasticsearch/service.yaml
  - redis/deployment.yaml
  - redis/service.yaml

# *.tpl files (app/secret.example.yaml.tpl, mongodb/secret.example.yaml.tpl,
# redis/secret.example.yaml.tpl) are deliberately not listed here - see the
# comment in app/secret.example.yaml.tpl for why.
