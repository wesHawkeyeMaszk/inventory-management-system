apiVersion: v1
kind: Service
metadata:
  name: inventory-app
  namespace: inventory
  annotations:
    # Standard scrape annotations for a Prometheus with the common
    # kubernetes_sd_configs role: service setup. If the cluster instead runs
    # the Prometheus Operator, a ServiceMonitor selecting this Service's
    # labels is the more idiomatic equivalent - annotations are kept here
    # since they need no extra CRDs and work with a plain Prometheus.
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "5000"
spec:
  selector:
    app: inventory-app
  ports:
    - port: 80
      targetPort: 5000
  type: NodePort
