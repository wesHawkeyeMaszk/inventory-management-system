name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC

jobs:
  trivy:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Build image for scanning
        run: docker build -t inventory-app:scan .

      # Findings are surfaced via the PR comment below rather than the
      # GitHub Security tab: SARIF upload requires GitHub Advanced Security,
      # which isn't available on private repos without an Enterprise plan.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: inventory-app:scan
          format: table
          severity: CRITICAL,HIGH
          output: trivy-table.txt

      - name: Print scan summary
        run: cat trivy-table.txt

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const table = fs.readFileSync('trivy-table.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔒 Security Scan Results\n\`\`\`\n${table}\n\`\`\``
            });
