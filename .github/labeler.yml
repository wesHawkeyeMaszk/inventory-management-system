backend:
  - changed-files:
    - any-glob-to-any-file: ["app/**", "requirements.txt"]

frontend:
  - changed-files:
    - any-glob-to-any-file: ["frontend/**"]

kubernetes:
  - changed-files:
    - any-glob-to-any-file: ["k8s/**"]

ci/cd:
  - changed-files:
    - any-glob-to-any-file: [".github/**"]

docs:
  - changed-files:
    - any-glob-to-any-file: ["*.md", "docs/**"]

docker:
  - changed-files:
    - any-glob-to-any-file: ["Dockerfile", "docker-compose.yml", "frontend/Dockerfile"]
